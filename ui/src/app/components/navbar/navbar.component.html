<nav class="navbar navbar-expand-sm bg-light navbar-light fixed-top border-bottom mb-4" id="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" [routerLink]="linkService.getHomeRouterLink()">Gen Con Planner</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navToggler"
                aria-controls="navToggler" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navToggler">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="javascript:void(0)" id="yearDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        {{ year() }}
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="yearDropdown">
                        <li *ngFor="let y of supportedYears()">
                            <a class="dropdown-item" href="javascript:void(0)" (click)="setYear(y)">{{ y }}</a>
                        </li>
                    </ul>
                </li>
                <li *ngIf="displayName()" class="nav-item"><a [routerLink]="linkService.getStarredRouterLink(year())" class="nav-link">My Events</a></li>
                <li *ngIf="displayName()" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="javascript:void(0)" id="userInfoDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        My Info
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="userInfoDropdown">
                        <li><a class="dropdown-item" [routerLink]="['/user']">Profile</a></li>
                        <li *ngIf="partyForCurrentYear() as p"><a class="dropdown-item" [routerLink]="['/party', p.year]">Party: {{ p.name }}</a></li>
                        <li *ngIf="isAdmin()"><a class="dropdown-item" [routerLink]="['/admin/orgs']">Merge Organizers</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="javascript:void(0)" (click)="signOut()">Log out</a></li>
                    </ul>
                </li>
                <li *ngIf="!displayName()" class="nav-link"><a href="javascript:void(0)" (click)="popupSignIn()">Log in</a></li>
                <li class="nav-item"><a [routerLink]="linkService.getAboutRouterLink()" class="nav-link">About</a></li>
            </ul>
            <form class="form-inline ms-auto d-flex" (submit)="onSearch($event)">
                <input type="text" class="form-control me-2" placeholder="Search..." name="q" [(ngModel)]="searchQuery"/>
                <button type="submit" class="btn btn-outline-primary btn-sm">Search</button>
            </form>
        </div>
    </div>
</nav>
