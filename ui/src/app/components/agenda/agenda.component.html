<div class="agenda-container">
    <div *ngIf="loading()" class="text-center py-4">
        <div class="spinner-border text-primary spinner-border-sm" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!loading()">
        <div *ngIf="agendaItems().length > 0; else noAgenda">
            <div class="timeline">
                <div *ngFor="let item of agendaItems()" class="timeline-item mb-3 p-3 border rounded shadow-sm bg-white" [ngClass]="getTierClass(item.tier)">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="d-flex align-items-center">
                            <i class="bi me-2 tier-icon" [ngClass]="getTierIconClass(item.tier)"></i>
                            <h4 class="h6 mb-0 fw-bold">
                                <a [href]="item.mapLink || item.genconUrl" target="_blank" class="text-dark text-decoration-none">
                                    {{ item.title }}
                                </a>
                            </h4>
                        </div>
                        <span class="timing-badge small px-2 py-1 bg-light rounded text-muted">
                            {{ formatTiming(item.startTime, item.endTime) }}
                        </span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
                        <div class="small text-muted text-uppercase tracking-wider">
                            {{ item.categoryCode }} • <a [routerLink]="linkService.getEventRouterLink(item.eventId)" class="text-decoration-none">{{ item.eventId }}</a>
                        </div>
                        <a [href]="item.genconUrl" target="_blank" class="btn btn-link btn-sm p-0 text-primary">
                            GenCon <i class="bi bi-box-arrow-up-right small"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <ng-template #noAgenda>
            <div class="alert alert-light border text-center py-4 mb-0">
                <p class="text-muted mb-0">No events found in your agenda for {{ year }}.</p>
                <small class="text-muted">Save some events to see them here!</small>
            </div>
        </ng-template>
    </div>
</div>
